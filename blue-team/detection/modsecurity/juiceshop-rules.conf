# ==============================================================================
# juiceshop-rules.conf
# Custom ModSecurity rules for the OWASP Juice Shop Blue Team exercise
# Project: "Live Wire, Purple Rain" — Red/Blue/Purple team lab
#
# STATUS: OPTIONAL / SECONDARY detection layer.
#   The primary, required detection mechanism for this project is the Python
#   log-watcher (see ../ for that component). This ModSecurity ruleset exists
#   purely as a side-by-side comparison: "what would an industry-standard WAF
#   catch, using the same attack scenarios the Red Team runs against Juice Shop?"
#   If you are short on time, skip this file entirely — see README.md.
#
# UNVERIFIED: These rules have not been tested against a live ModSecurity +
#   Nginx + Juice Shop install (no live environment was available at write time).
#   Treat every rule here as a best-effort draft based on documented
#   ModSecurity v3 / OWASP CRS syntax conventions. Validate with real traffic
#   (or at minimum `nginx -t` + a manual curl/browser test) before trusting
#   any alert — or lack of one — that comes out of this file.
#
# ID RANGE: All custom rule IDs use 9000000+ to stay well clear of:
#   - OWASP CRS IDs                (typically 900000–999999 / 1000000s banding)
#   - ModSecurity reserved ranges  (1–99999)
#   - Other local/custom rule files you may add later
#   If you add more rules, keep incrementing within 9000000–9000999 for this
#   file so IDs stay predictable and collision-free across the project.
#
# DEFAULT POSTURE: log,pass (detect/alert only), NOT deny.
#   This project's evidence narrative is: attack -> detect -> fix -> retest.
#   A silently-blocking WAF hides the "detect" step from your own report and
#   also prevents you from exercising the vulnerable Juice Shop endpoints
#   during Red Team runs. Each rule below shows the commented alternate
#   action to flip to `deny,status:403` once the team deliberately moves
#   from detection-only to prevention/retest mode.
# ==============================================================================


# ------------------------------------------------------------------------------
# SECTION 1: SQL Injection detection (request ARGS + body)
# ------------------------------------------------------------------------------

# 9000001 - SQLi: UNION SELECT (classic UNION-based injection)
SecRule ARGS|REQUEST_BODY "@rx (?i:union\s+(all\s+)?select)" \
    "id:9000001,\
    phase:2,\
    log,\
    pass,\
    msg:'Juice Shop WAF: Possible SQL Injection - UNION SELECT detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'attack-sqli',\
    tag:'juiceshop-blueteam'"
    # To BLOCK instead of just log, replace the action line above with:
    # "id:9000001,phase:2,deny,status:403,msg:'...',severity:'CRITICAL'"

# 9000002 - SQLi: boolean tautology ' OR 1=1 (and common variants)
SecRule ARGS|REQUEST_BODY "@rx (?i:['\"]?\s*or\s+['\"]?\s*1\s*=\s*1|['\"]?\s*or\s+['\"]?\s*['\"]?\s*=\s*['\"]?)" \
    "id:9000002,\
    phase:2,\
    log,\
    pass,\
    msg:'Juice Shop WAF: Possible SQL Injection - boolean tautology (OR 1=1)',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'attack-sqli',\
    tag:'juiceshop-blueteam'"
    # Blocking alternate:
    # "id:9000002,phase:2,deny,status:403,msg:'...',severity:'CRITICAL'"

# 9000003 - SQLi: SQL comment sequences used to truncate queries (-- , #, /* */)
SecRule ARGS|REQUEST_BODY "@rx (--|#|/\*.*?\*/)\s*$|(?i:;\s*--)" \
    "id:9000003,\
    phase:2,\
    log,\
    pass,\
    msg:'Juice Shop WAF: Possible SQL Injection - SQL comment truncation sequence',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'attack-sqli',\
    tag:'juiceshop-blueteam'"
    # Blocking alternate:
    # "id:9000003,phase:2,deny,status:403,msg:'...',severity:'CRITICAL'"

# 9000004 - SQLi: stacked query / statement injection attempt (; DROP, ; INSERT, etc.)
SecRule ARGS|REQUEST_BODY "@rx (?i:;\s*(drop|insert|update|delete|alter)\s+)" \
    "id:9000004,\
    phase:2,\
    log,\
    pass,\
    msg:'Juice Shop WAF: Possible SQL Injection - stacked query / DDL-DML injection',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'attack-sqli',\
    tag:'juiceshop-blueteam'"
    # Blocking alternate:
    # "id:9000004,phase:2,deny,status:403,msg:'...',severity:'CRITICAL'"

# 9000005 - SQLi: common SQL function probing (sleep(), benchmark(), version())
SecRule ARGS|REQUEST_BODY "@rx (?i:\b(sleep|benchmark|version|sqlite_version|load_file|pg_sleep)\s*\()" \
    "id:9000005,\
    phase:2,\
    log,\
    pass,\
    msg:'Juice Shop WAF: Possible SQL Injection - blind/time-based SQLi function probe',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'attack-sqli',\
    tag:'juiceshop-blueteam'"
    # Blocking alternate:
    # "id:9000005,phase:2,deny,status:403,msg:'...',severity:'CRITICAL'"


# ------------------------------------------------------------------------------
# SECTION 2: Cross-Site Scripting (XSS) detection - reflected/stored
# ------------------------------------------------------------------------------

# 9000010 - XSS: <script tag injection
SecRule ARGS|REQUEST_BODY "@rx (?i:<\s*script[\s>/])" \
    "id:9000010,\
    phase:2,\
    log,\
    pass,\
    msg:'Juice Shop WAF: Possible XSS - <script> tag detected in request',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'attack-xss',\
    tag:'juiceshop-blueteam'"
    # Blocking alternate:
    # "id:9000010,phase:2,deny,status:403,msg:'...',severity:'CRITICAL'"

# 9000011 - XSS: inline event handler injection (onerror=, onload=, onclick=, etc.)
SecRule ARGS|REQUEST_BODY "@rx (?i:\bon(error|load|click|mouseover|focus|input|pageshow)\s*=)" \
    "id:9000011,\
    phase:2,\
    log,\
    pass,\
    msg:'Juice Shop WAF: Possible XSS - inline event handler (onerror=/onload=/etc.) detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'attack-xss',\
    tag:'juiceshop-blueteam'"
    # Blocking alternate:
    # "id:9000011,phase:2,deny,status:403,msg:'...',severity:'CRITICAL'"

# 9000012 - XSS: javascript: URI scheme injection
SecRule ARGS|REQUEST_BODY "@rx (?i:javascript\s*:)" \
    "id:9000012,\
    phase:2,\
    log,\
    pass,\
    msg:'Juice Shop WAF: Possible XSS - javascript: URI scheme detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'attack-xss',\
    tag:'juiceshop-blueteam'"
    # Blocking alternate:
    # "id:9000012,phase:2,deny,status:403,msg:'...',severity:'CRITICAL'"

# 9000013 - XSS: <img>/<svg> onerror combo (common Juice Shop XSS challenge payload shape)
SecRule ARGS|REQUEST_BODY "@rx (?i:<\s*(img|svg|iframe|body)\b[^>]*on(error|load)\s*=)" \
    "id:9000013,\
    phase:2,\
    log,\
    pass,\
    msg:'Juice Shop WAF: Possible XSS - tag with inline error/load handler (img/svg/iframe)',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'attack-xss',\
    tag:'juiceshop-blueteam'"
    # Blocking alternate:
    # "id:9000013,phase:2,deny,status:403,msg:'...',severity:'CRITICAL'"


# ------------------------------------------------------------------------------
# SECTION 3: JWT tampering detection
# ------------------------------------------------------------------------------
# Juice Shop's auth challenges include the classic "alg: none" JWT forgery
# (removing/forging the signature by setting the algorithm to "none").
# We check both the Authorization header and the request body, since JWTs
# are sometimes passed in a body field (e.g. a "token" JSON field) rather
# than strictly as a Bearer header.

# 9000020 - JWT tampering: alg":"none" (JSON-encoded form) in Authorization header or body
SecRule REQUEST_HEADERS:Authorization|ARGS|REQUEST_BODY "@rx (?i:alg[\"']?\s*:\s*[\"']?none)" \
    "id:9000020,\
    phase:2,\
    log,\
    pass,\
    msg:'Juice Shop WAF: Possible JWT tampering - alg:none detected in token',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'attack-jwt-tampering',\
    tag:'juiceshop-blueteam'"
    # Blocking alternate:
    # "id:9000020,phase:2,deny,status:403,msg:'...',severity:'CRITICAL'"

# 9000021 - JWT tampering: alg=none (query-string / form-encoded form)
SecRule REQUEST_HEADERS:Authorization|ARGS|REQUEST_BODY "@rx (?i:alg\s*=\s*none\b)" \
    "id:9000021,\
    phase:2,\
    log,\
    pass,\
    msg:'Juice Shop WAF: Possible JWT tampering - alg=none detected (form-encoded)',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'attack-jwt-tampering',\
    tag:'juiceshop-blueteam'"
    # Blocking alternate:
    # "id:9000021,phase:2,deny,status:403,msg:'...',severity:'CRITICAL'"

# NOTE: A JWT's header is base64url-encoded, so a tampered token sent as a
# single opaque Bearer string (eyJhbGciOiJub25lIi...) will NOT match these
# regexes in transit - they only catch the alg:none signature when it
# appears in cleartext (e.g. in a body field, a debug log replay, or a
# non-base64 proof-of-concept payload pasted directly into a request).
# For full coverage of base64url-encoded "none" tokens, a decode step is
# required, which is beyond plain SecRule regex matching and belongs in the
# Python log-watcher (which can base64-decode and inspect JWT headers
# programmatically) - this is exactly the kind of gap this WAF-comparison
# layer is meant to illustrate.


# ------------------------------------------------------------------------------
# SECTION 4: IDOR / BOLA visibility logging (NOT a fix - detection only)
# ------------------------------------------------------------------------------
# IMPORTANT: ModSecurity/the WAF has no concept of "is this the requesting
# user's own basket/user record" - it cannot see application-level session
# ownership. True IDOR/BOLA prevention MUST happen in the application layer
# (e.g. Juice Shop/Express-level authorization checks tying the basket or
# user ID in the URL to the authenticated session's own ID). These rules
# only log that *someone* requested a numeric-ID basket/user endpoint, so the
# Blue Team has a visibility trail to cross-reference against the
# authenticated user in the same request - they intentionally do NOT block,
# since blocking here would also break all legitimate basket/profile access.

# 9000030 - IDOR/BOLA visibility: /rest/basket/<id> access logging
SecRule REQUEST_URI "@rx (?i:/rest/basket/\d+)" \
    "id:9000030,\
    phase:1,\
    log,\
    pass,\
    msg:'Juice Shop WAF: Visibility log - /rest/basket/<id> accessed (verify ownership at app layer)',\
    logdata:'URI: %{REQUEST_URI}, Authorization: %{REQUEST_HEADERS.Authorization}',\
    severity:'NOTICE',\
    tag:'idor-bola-visibility',\
    tag:'juiceshop-blueteam'"
    # This rule is intentionally detect-only (log,pass) and is NOT meant to be
    # flipped to deny - a blanket block on this path breaks normal basket
    # use for every legitimate user, since the WAF cannot tell "my basket"
    # from "someone else's basket" by ID alone. Leave as log,pass.

# 9000031 - IDOR/BOLA visibility: /api/Users/<id> access logging
SecRule REQUEST_URI "@rx (?i:/api/Users/\d+)" \
    "id:9000031,\
    phase:1,\
    log,\
    pass,\
    msg:'Juice Shop WAF: Visibility log - /api/Users/<id> accessed (verify ownership at app layer)',\
    logdata:'URI: %{REQUEST_URI}, Authorization: %{REQUEST_HEADERS.Authorization}',\
    severity:'NOTICE',\
    tag:'idor-bola-visibility',\
    tag:'juiceshop-blueteam'"
    # Same note as 9000030: intentionally log,pass only. Real ownership
    # enforcement belongs in Juice Shop's own route/middleware logic, not
    # in the WAF. Use this log line as corroborating evidence alongside the
    # Python log-watcher's own IDOR detection, not as the control itself.

# ==============================================================================
# End of juiceshop-rules.conf
# ==============================================================================
